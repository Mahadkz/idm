name: linux
on:
  push:
  pull_request:
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libfontconfig-dev libfreetype-dev xvfb xdotool ffmpeg mingw-w64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: Swatinem/rust-cache@v2
      # The media code and suites are developed against a current ffmpeg/ffprobe master build;
      # Ubuntu's apt ffmpeg 6.1 does not expose the HLS WebVTT subtitle track the tests expect.
      - name: Current static ffmpeg
        run: |
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          curl -fsSL --retry 5 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace
      # media_live_tasks is skipped while authenticated live streams fail on main (open item: a
      # private media relay is being added). Remove the skip once that fix lands.
      - name: Integration suites (strict, every prerequisite installed)
        run: python3 tests/run_all.py --strict --skip chromium_real media_live_tasks
      - name: Windows cross-build
        run: cargo build --workspace --target x86_64-pc-windows-gnu
