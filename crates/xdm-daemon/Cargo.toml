[package]
name = "xdm-daemon"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
xdm-http = { path = "../xdm-http" }
xdm-ipc = { path = "../xdm-ipc" }
xdm-media = { path = "../xdm-media" }
xdm-categories = { path = "../xdm-categories" }
xdm-ftp = { path = "../xdm-ftp" }
sha2 = "0.10"
xdm-grabber = { path = "../xdm-grabber" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
url = "2"
percent-encoding = "2"
interprocess = "2.4"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
xdm-transfer-list = { path = "../xdm-transfer-list" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Console"] }
