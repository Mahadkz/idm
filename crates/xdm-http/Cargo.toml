[package]
name = "xdm-http"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"


[target.'cfg(unix)'.dependencies]
libc = "0.2"
