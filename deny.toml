[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-gnu", "x86_64-pc-windows-msvc"]

[advisories]
version = 2
ignore = [
  # Unmaintained, no fix; pulled in by slint/winit's client-side window decorations (sctk-adwaita).
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; transitive via winit, no safe upgrade" },
]

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC",
  "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "MPL-2.0", "CC0-1.0", "0BSD", "BSL-1.0",
  "GPL-3.0", "GPL-3.0-only", "GPL-3.0-or-later", "LGPL-3.0", "OpenSSL", "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
